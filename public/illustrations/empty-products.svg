<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shopping cart illustration -->
  <circle cx="200" cy="150" r="120" fill="#f0f0f0"/>

  <!-- Cart body -->
  <path d="M140 100 L150 100 L170 180 L240 180 L260 100 L270 100 M150 100 L260 100" stroke="#66bb6a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Cart items (boxes) -->
  <rect x="170" y="120" width="30" height="30" fill="#66bb6a" opacity="0.3" rx="3"/>
  <rect x="210" y="120" width="30" height="30" fill="#66bb6a" opacity="0.5" rx="3"/>

  <!-- Cart wheels -->
  <circle cx="185" cy="195" r="8" fill="#66bb6a"/>
  <circle cx="225" cy="195" r="8" fill="#66bb6a"/>

  <!-- Decorative elements -->
  <circle cx="260" cy="80" r="4" fill="#66bb6a" opacity="0.3"/>
  <circle cx="140" cy="90" r="3" fill="#66bb6a" opacity="0.3"/>
  <circle cx="270" cy="170" r="5" fill="#66bb6a" opacity="0.2"/>
</svg>
